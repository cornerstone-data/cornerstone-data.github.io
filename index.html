<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cornerstone Docs</title>
<meta name="description" content="Documentation for Cornerstone Sustainability Data Initiative datasets and models.">
<style>
  :root { --bg: #ffffff; --fg: #222426; --muted: #5b5f63; --border: #d9dcdf; --card: #f6f7f8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181a; --fg: #f1f2f3; --muted: #a8adb2; --border: #33373b; --card: #1f2225; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  header img { height: 40px; width: auto; }
  .logo-dark { display: none; }
  @media (prefers-color-scheme: dark) { .logo-light { display: none; } .logo-dark { display: inline; } }
  h1 { font-size: 1.75rem; margin: 32px 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 32px; }
  a.card { display: block; padding: 20px; border: 1px solid var(--border); border-radius: 8px;
           background: var(--card); color: inherit; text-decoration: none; margin-bottom: 16px; }
  a.card:hover { border-color: var(--fg); }
  a.card h2 { font-size: 1.15rem; margin: 0 0 4px; }
  a.card p { margin: 0; color: var(--muted); }
  footer { margin-top: 48px; font-size: 0.9rem; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <a href="https://cornerstonedata.org">
      <img class="logo-light" src="logo.svg" alt="Cornerstone">
      <img class="logo-dark" src="logo-dark.svg" alt="Cornerstone">
    </a>
  </header>
  <h1>Documentation</h1>
  <p class="lead">Methods, data, and guidance for Cornerstone datasets and models.</p>

  <a class="card" href="eeio/">
    <h2>Cornerstone EEIO model</h2>
    <p>The multi-regional environmentally-extended input-output model and its supply chain emission factors.</p>
  </a>

  <footer>
    <a href="https://cornerstonedata.org">cornerstonedata.org</a>
  </footer>
</main>
</body>
</html>
